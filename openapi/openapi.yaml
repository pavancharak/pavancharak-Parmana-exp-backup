                $ref: '../schemas/common/error.schema.json'
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    error: businessTransactionId is required.

        '404':
          description: >-
            businessTransactionId does not correspond to any Execution Trust
            Record (VerificationFailedError, the same not-found error used by
            POST /verify).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

  /policies/validate:
    post:
      tags:
        - Policies
      summary: Validate that a Policy exists and is readable
      operationId: validatePolicy
      description: >
        Checks that policies/{policyId}/{policyVersion}/policy.json exists and
        parses. Does NOT use the shared Error envelope for its failure
        responses — every status code (200, 400, 404) returns the same
        {valid, errors} shape. Field checks run in order: policyId first, then
        policyVersion; the first missing/empty field short-circuits with its
        own message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/requests/policy-validate-request.schema.json'
            examples:
              vendor-payment:
                summary: Real captured request
                value:
                  policyId: vendor-payment
                  policyVersion: 2.0.0
              notFound:
                summary: Real captured request — unknown policy
                value:
                  policyId: does-not-exist
                  policyVersion: 9.9.9
      responses:
        '200':
          description: Policy exists and is readable.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/policy-validate-response.schema.json'
              examples:
                vendor-payment:
                  summary: Real captured response
                  value:
                    valid: true
                    errors: []

        '400':
          description: policyId or policyVersion missing/empty.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/policy-validate-response.schema.json'
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - policyVersion is required.

        '404':
          description: No policy.json exists at the requested name/version (PolicyNotFoundError, caught locally and re-shaped — not routed through the shared error handler).
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/policy-validate-response.schema.json'
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - "Policy 'does-not-exist' version '9.9.9' was not found."

components:
  schemas:
    Error:
      $ref: '../schemas/common/error.schema.json'
