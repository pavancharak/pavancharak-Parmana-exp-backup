        '400':
          description: >-
            businessTransactionId missing/malformed, or a Business
            Transaction trust-chain invariant failed
            (BusinessTransactionValidationError) — identical checks and
            treatment to POST /execute.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                badUuid:
                  summary: Real captured response — malformed businessTransactionId
                  value:
                    error: businessTransactionId must be a valid UUID.
                invariantMismatch:
                  summary: Real captured response — authorization.authorityId does not match authority.authorityId
                  value:
                    error: authorization.authorityId must match authority.authorityId.

        '404':
          description: >-
            transaction.policy.name/version does not match any published
